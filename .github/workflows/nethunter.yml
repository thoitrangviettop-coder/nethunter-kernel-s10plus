name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Ép hệ thống kéo toàn bộ lịch sử nhánh mã nguồn của dự án
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download Toolchain via Prebuilt Archive
        run: |
          mkdir -p toolchain/gcc64
          curl -L https://github.com | tar -xzf - -C toolchain/gcc64 --strip-components=1

      - name: Switch to NetHunter Kernel Branch
        run: |
          # Kiểm tra và tự động chuyển đổi sang nhánh chứa mã nguồn nhân Linux của tác giả
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          
          # Tự động đồng bộ mã nguồn nhánh nethunter từ kho lưu trữ gốc của tác giả
          git remote add upstream https://github.com || true
          git fetch upstream
          
          # Ép tạo thư mục làm việc dựa trên nhánh chứa mã nguồn nhân Linux 4.14
          git checkout -b build_branch upstream/nethunter-lineage-23.2 || git checkout -b build_branch upstream/main || true
          cp -r configs scripts build.sh ./ 2>/dev/null || true

      - name: Compile NetHunter Kernel Core
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          # Đồng bộ tệp tin cấu hình defconfig phần cứng S10+
          mkdir -p arch/arm64/configs
          cp configs/*_defconfig arch/arm64/configs/ 2>/dev/null || true
          cp configs/*defconfig arch/arm64/configs/ 2>/dev/null || true
          
          # Lựa chọn cấu hình và kích hoạt trình dịch chip Exynos 9820
          if [ -f arch/arm64/configs/exynos9820_defconfig ]; then
            make exynos9820_defconfig
          elif [ -f arch/arm64/configs/beyond2lte_defconfig ]; then
            make beyond2lte_defconfig
          else
            make $(ls arch/arm64/configs/ | grep -iE 'exynos|beyond' | head -n 1) || make defconfig
          fi
          
          make -j$(nproc) KCFLAGS="-w" CFLAGS_MODULE="-w"

      - name: Pack Kernel Into Zip
        run: |
          git clone https://github.com Update-Zip
          find arch/arm64/boot/ out/arch/arm64/boot/ -maxdepth 2 -type f -name "Image*" -exec cp {} Update-Zip/ \;
          cd Update-Zip
          zip -r9 ../NetHunter-Kernel-S10Plus.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10Plus
          path: NetHunter-Kernel-S10Plus.zip
