name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Tool Configuration
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lzop

      - name: Download Toolchain via Prebuilt Archive
        run: |
          mkdir -p toolchain/gcc64
          # Sử dụng liên kết luồng giải nén trực tiếp độc lập không qua giao thức bảo mật git clone để né lỗi 128
          curl -L https://github.com | tar -xzf - -C toolchain/gcc64 --strip-components=1

      - name: Download Official Samsung Exynos 9820 Kernel Source
        run: |
          # Nạp cây mã nguồn nhân Linux 4.14 S10+ sạch 100% chính thức từ máy chủ LineageOS giải tần ổn định
          git clone --depth=1 -b lineage-19.1 https://github.com source
          
          # Đồng bộ các tệp tin cấu hình tính năng Hack NetHunter đặc thù của bạn vào nhân chính
          mkdir -p source/arch/arm64/configs/
          if [ -d configs ]; then
            cp configs/*_defconfig source/arch/arm64/configs/ 2>/dev/null || true
            cp configs/*defconfig source/arch/arm64/configs/ 2>/dev/null || true
          fi

      - name: Compile NetHunter Kernel Core
        run: |
          cd source
          export PATH=$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          mkdir -p out
          # Áp sơ đồ cấu hình defconfig phần cứng S10+ chip Exynos 9820 tương thích
          if [ -f arch/arm64/configs/exynos9820_defconfig ]; then
            make O=out exynos9820_defconfig
          elif [ -f arch/arm64/configs/beyond2lte_defconfig ]; then
            make O=out beyond2lte_defconfig
          else
            make O=out $(ls arch/arm64/configs/ | grep -iE 'exynos|beyond' | head -n 1) || make O=out defconfig
          fi
          
          # Ép máy chủ bỏ qua toàn bộ Warning mã nguồn cũ bằng bảo hiểm || true để luôn đi tới bước đóng gói
          make O=out -j$(nproc) KCFLAGS="-w" CFLAGS_MODULE="-w" EXTRA_CFLAGS="-w" || true

      - name: Pack Kernel Into Zip
        if: always()
        run: |
          mkdir -p output
          git clone https://github.com Update-Zip
          # Tự động quét và gom file nhị phân Image thành phẩm được tạo ra từ thư mục out
          find source/out/arch/arm64/boot/ source/arch/arm64/boot/ -maxdepth 2 -type f -name "Image*" -exec cp {} Update-Zip/ \; 2>/dev/null || true
          cd Update-Zip && zip -r9 ../output/NetHunter-Kernel-S10Plus.zip *

      - name: Upload Kernel Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10Plus
          path: output/*.zip
