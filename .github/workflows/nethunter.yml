name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:

jobs:
  build-kernel:
    # Hạ cấp xuống 22.04 để tương thích hoàn toàn với tập lệnh cấu hình apt-get cũ của tác giả
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auto-Detect and Switch to NetHunter Branch
        run: |
          # Thiết lập cấu hình Git cơ bản
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          
          # Đồng bộ toàn bộ các nhánh ẩn chứa mã nguồn nhân Linux từ kho gốc của tác giả
          git remote add upstream https://github.com || true
          git fetch upstream
          
          # Ép hệ thống chuyển sang nhánh chứa mã nguồn đầy đủ
          git checkout -f nethunter-lineage-23.2 || git checkout -f main || true

      - name: Run Official Build Script
        run: |
          # Cấp quyền thực thi và gọi trực tiếp skrip thông minh tự động dịch của tác giả
          chmod +x build.sh scripts/*.sh
          ./build.sh
        continue-on-error: true

      - name: Pack Kernel Into Zip (Fallback)
        if: always()
        run: |
          # Kịch bản dự phòng bảo hiểm: Nếu build.sh không tự gói zip, hệ thống sẽ tự quét tìm file Image để gói
          if [ ! -d "output" ] || [ -z "$(ls -A output/*.zip 2>/dev/null)" ]; then
            mkdir -p output
            git clone https://github.com Update-Zip
            find . -maxdepth 4 -type f -name "Image*" -exec cp {} Update-Zip/ \; 2>/dev/null || true
            cd Update-Zip && zip -r9 ../output/NetHunter-Kernel-S10Plus.zip *
          fi

      - name: Upload Kernel Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10Plus
          # Tải lên toàn bộ file thành phẩm dạng ZIP xuất hiện trong thư mục output
          path: output/*.zip
