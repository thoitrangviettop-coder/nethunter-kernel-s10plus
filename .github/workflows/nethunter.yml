name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lzop

      - name: Download Toolchain via Prebuilt Archive
        run: |
          mkdir -p toolchain/gcc64
          curl -L https://github.com | tar -xzf - -C toolchain/gcc64 --strip-components=1

      - name: Auto-Detect Kernel Source Tree
        run: |
          git remote add upstream https://github.com || true
          git fetch upstream
          
          if git branch -r | grep -q "upstream/nethunter"; then
            git checkout -f $(git branch -r | grep "upstream/nethunter" | head -n 1 | sed 's/upstream\///')
          else
            git checkout -f main || git checkout -f master
          fi

      - name: Compile NetHunter Kernel Core
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          # Ép hệ thống sao chép file cấu hình từ thư mục configs gốc vào cấu trúc nhân của Linux
          mkdir -p arch/arm64/configs/
          if [ -d configs ]; then
            cp configs/*_defconfig arch/arm64/configs/ 2>/dev/null || true
            cp configs/*defconfig arch/arm64/configs/ 2>/dev/null || true
          fi
          
          # Lựa chọn file cấu hình phần cứng Samsung S10+ chip Exynos 9820
          if [ -f arch/arm64/configs/exynos9820_defconfig ]; then
            make exynos9820_defconfig
          elif [ -f arch/arm64/configs/beyond2lte_defconfig ]; then
            make beyond2lte_defconfig
          elif [ -f arch/arm64/configs/nethunter_beyond2lte_defconfig ]; then
            make nethunter_beyond2lte_defconfig
          else
            make $(ls arch/arm64/configs/ | grep -iE 'exynos|beyond' | head -n 1) || make defconfig
          fi
          
          # Thực hiện biên dịch lõi thực tế và tắt toàn bộ cảnh báo cũ để tránh dừng mã lỗi 2
          make -j$(nproc) KCFLAGS="-w" CFLAGS_MODULE="-w"

      - name: Pack Kernel Into Zip
        run: |
          git clone https://github.com Update-Zip
          find arch/arm64/boot/ out/arch/arm64/boot/ -maxdepth 2 -type f -name "Image*" -exec cp {} Update-Zip/ \; 2>/dev/null || true
          cd Update-Zip
          zip -r9 ../NetHunter-Kernel-S10Plus.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10Plus
          path: NetHunter-Kernel-S10Plus.zip
