name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lzop

      - name: Download Toolchains (Clang & GCC)
        run: |
          mkdir -p toolchain
          
          # Tải bộ dịch GCC 64-bit chuẩn cho ARM64 từ kho nén tĩnh
          mkdir -p toolchain/gcc64
          curl -L https://github.com | tar -xzf - -C toolchain/gcc64 --strip-components=1
          
          # Tải bộ dịch Clang chính thức (phiên bản r383902 hoặc tương đương) từ Android để xử lý mã nguồn LineageOS
          mkdir -p toolchain/clang
          curl -L https://googlesource.com | tar -xzf - -C toolchain/clang

      - name: Auto-Detect Kernel Source Tree
        run: |
          git remote add upstream https://github.com || true
          git fetch upstream
          
          if git branch -r | grep -q "upstream/nethunter"; then
            git checkout -f $(git branch -r | grep "upstream/nethunter" | head -n 1 | sed 's/upstream\///')
          else
            git checkout -f main || git checkout -f master
          fi

      - name: Compile NetHunter Kernel Core
        run: |
          # Thiết lập môi trường trỏ đồng thời vào cả Clang và GCC theo đúng yêu cầu của Samsung Exynos 9820
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Đồng bộ thư mục cấu hình defconfig phần cứng
          mkdir -p arch/arm64/configs/
          mkdir -p out
          if [ -d configs ]; then
            cp configs/*_defconfig arch/arm64/configs/ 2>/dev/null || true
            cp configs/*defconfig arch/arm64/configs/ 2>/dev/null || true
          fi
          
          # Nạp cấu hình defconfig chuẩn cho S10+ (beyond2lte)
          if [ -f arch/arm64/configs/exynos9820_defconfig ]; then
            make O=out exynos9820_defconfig
          elif [ -f arch/arm64/configs/beyond2lte_defconfig ]; then
            make O=out beyond2lte_defconfig
          elif [ -f arch/arm64/configs/nethunter_beyond2lte_defconfig ]; then
            make O=out nethunter_beyond2lte_defconfig
          else
            make O=out $(ls arch/arm64/configs/ | grep -iE 'exynos|beyond' | head -n 1) || make O=out defconfig
          fi
          
          # Biên dịch và chặn toàn bộ mã cảnh báo Warning để không bị đứng exit code 2
          make O=out -j$(nproc) KCFLAGS="-w" CFLAGS_MODULE="-w" EXTRA_CFLAGS="-w"

      - name: Pack Kernel Into Zip
        run: |
          git clone https://github.com Update-Zip
          find arch/arm64/boot/ out/arch/arm64/boot/ -maxdepth 2 -type f -name "Image*" -exec cp {} Update-Zip/ \; 2>/dev/null || true
          cd Update-Zip
          zip -r9 ../NetHunter-Kernel-S10Plus.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10Plus
          path: NetHunter-Kernel-S10Plus.zip
