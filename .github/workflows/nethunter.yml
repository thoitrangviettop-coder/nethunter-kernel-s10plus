name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Missing Compiler Dependencies
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lzop libncurses5

      - name: Run Script Builder Official
        run: |
          # 1. Đảm bảo loại bỏ các thư mục rác hoặc thư mục trùng tên trước khi chạy script tải nguồn
          rm -rf output/
          mkdir -p output
          
          # 2. Cấp quyền thực thi tập lệnh
          chmod +x build.sh scripts/*.sh
          
          # 3. Ép cấu hình môi trường không tương tác (Non-interactive) cho Git trong GitHub Actions
          export GIT_TERMINAL_PROMPT=0
          
          # 4. Bỏ qua các cảnh báo toán tử lỗi thời của mã nguồn cũ
          export KCFLAGS="-w"
          export CFLAGS_MODULE="-w"
          export EXTRA_CFLAGS="-w"
          
          # 5. Thực thi biên dịch nhân
          ./build.sh

      - name: Upload Flashable NetHunter Kernel ZIP
        # Thay đổi từ always() thành success() để chỉ upload khi build thành công, tránh tốn tài nguyên artifact nếu lỗi
        if: success() 
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10Plus
          path: output/*.zip
          retention-days: 7 # Tự động xóa sau 7 ngày để tối ưu dung lượng lưu trữ kho chứa
