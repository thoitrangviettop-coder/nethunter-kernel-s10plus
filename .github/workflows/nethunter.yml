name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn Kernel từ Repository của bạn về máy chủ ảo
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Cài đặt các công cụ hệ thống cần thiết để biên dịch Kernel Android
    - name: Setup Build Environment
      run: |
        # Sửa lỗi nghẽn cổng kết nối và cập nhật danh sách gói
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get update --fix-missing
        
        # Cài đặt môi trường kèm lệnh tự động sửa lỗi nếu kẹt (-y --fix-broken)
        sudo apt-get install -y --fix-broken bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    # 3. Tải bộ công cụ biên dịch (Toolchain GCC 4.9 cho Aarch64)
    - name: Download Toolchain
      run: |
        mkdir toolchain
        cd toolchain
        git clone --depth=1 https://github.com gcc64

    # 4. Thực hiện lệnh cấu hình và biên dịch Kernel Exynos 9820 (Samsung S10+)
    - name: Compile Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        
        # Thiết lập cấu hình mặc định cho chip Exynos 9820
        make exynos9820_defconfig
        
        # Bắt đầu biên dịch với toàn bộ sức mạnh lõi CPU của máy chủ ảo
        make -j$(nproc)

    # 5. Đóng gói sản phẩm thành file ZIP thông qua công cụ AnyKernel3
    - name: Pack Kernel Into Zip
      run: |
        git clone https://github.com Update-Zip
        cp out/arch/arm64/boot/Image.gz-dtb Update-Zip/ 2>/dev/null || cp out/arch/arm64/boot/Image Update-Zip/
        cd Update-Zip
        zip -r9 ../NetHunter-Kernel-S10Plus.zip *

    # 6. Đẩy sản phẩm lên mục Artifacts để bạn tải về máy điện thoại
    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-S10Plus
        path: NetHunter-Kernel-S10Plus.zip
