name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:

jobs:
  build-kernel:
    # Sử dụng Ubuntu 22.04 để tương thích tuyệt đối với các thư viện gcc-multilib ARM32 của tác giả
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Missing Compiler Dependencies
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          # Cài đặt toàn bộ lõi công cụ dịch bao gồm cả lzop và các gói hỗ trợ dịch chéo cấu trúc 32-bit/64-bit
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lzop libncurses5

      - name: Run Script Builder Official
        run: |
          # Cấp quyền tối cao cho toàn bộ tập lệnh của tác giả
          chmod +x build.sh scripts/*.sh
          
          # Cho phép bỏ qua các cảnh báo toán tử lỗi thời của nhân mã nguồn Linux cũ
          export KCFLAGS="-w"
          export CFLAGS_MODULE="-w"
          export EXTRA_CFLAGS="-w"
          
          # Kích hoạt trực tiếp tập lệnh gốc thông minh để hệ thống tự xử lý tự động
          ./build.sh

      - name: Upload Flashable NetHunter Kernel ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10Plus
          # Tải lên file ZIP thành phẩm được sinh ra trực tiếp tại thư mục đầu ra output/ của build.sh
          path: output/*.zip
