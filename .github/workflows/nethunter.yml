name: Build NetHunter V2
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  K_REPO: https://github.com
  F_REPO: https://github.com
  DEFCONFIG: nethunter_beyond2lte_defconfig
  GIT_SSL_NO_VERIFY: "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget bc bison flex zip unzip cpio rsync
          sudo apt-get install -y python3 python3-pip python3-setuptools python3-dev
          sudo apt-get install -y libssl-dev libelf-dev libncurses-dev device-tree-compiler
          sudo apt-get install -y gcc g++ gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo apt-get install -y clang llvm lld dwarves pahole

      - name: Clone
        run: |
          git config --global http.sslVerify false
          git config --global http.postBuffer 524288000
          git config --global https.postBuffer 524288000
          git config --global --add safe.directory '*'
          git clone --depth=1 "${K_REPO}" kernel
          git clone --depth=1 "${F_REPO}" freerunner

      - name: Config
        working-directory: kernel
        run: |
          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            if [ -f "arch/arm64/configs/exynos9820_defconfig" ]; then
              DEFCONFIG=exynos9820_defconfig
            elif [ -f "arch/arm64/configs/universal9820_defconfig" ]; then
              DEFCONFIG=universal9820_defconfig
            else
              DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1 | xargs basename)
            fi
          fi
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "${DEFCONFIG}"

      - name: Compile
        working-directory: kernel
        run: |
          make -j$(nproc --all) \
            O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          test -f out/arch/arm64/boot/Image

      - name: Pack
        run: |
          mkdir -p output_zip
          git clone --depth=1 https://github.com pkg
          cd pkg
          cp ../kernel/out/arch/arm64/boot/Image .
          sed -i 's/device.name1=.*/device.name1=beyond2lte/' anykernel.sh
          zip -r9 "../output_zip/NetHunter-S10Plus.zip" * -x .git*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel
          path: output_zip/*.zip
