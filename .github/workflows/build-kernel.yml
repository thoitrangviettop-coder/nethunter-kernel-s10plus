name: Build NetHunter Kernel S10+

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile NetHunter Kernel (beyond2lte)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lzop libncurses5

      - name: Run Script Builder Official
        run: |
          # Dọn dẹp thư mục đầu ra trước khi chạy
          rm -rf output/
          mkdir -p output
          
          # Cấp quyền thực thi tập lệnh
          chmod +x build.sh scripts/*.sh
          
          # Cấu hình môi trường không tương tác cho Git
          export GIT_TERMINAL_PROMPT=0
          
          # Ẩn các cảnh báo toán tử cũ của mã nguồn Linux 4.14
          export KCFLAGS="-w"
          export CFLAGS_MODULE="-w"
          export EXTRA_CFLAGS="-w"
          
          # Chạy script biên dịch
          ./build.sh

      - name: Upload Flashable NetHunter Kernel ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10Plus
          path: output/*.zip
          retention-days: 7
